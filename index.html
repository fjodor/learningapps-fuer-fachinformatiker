<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lernapp-Tabelle</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>

<body>
  <table id="lernapp" class="display">
    <thead>
    <tr>
      <th>Thema</th>
      <th>Stichworte</th>
      <th>Lernfeld</th>
      <th>Link</th>
    </tr>
  </thead>
  </table>

<script>
  fetch("daten.json")
    .then(r => r.json())
    .then(data => {

      let table = $('#lernapp').DataTable({
        data: data,
        orderCellsTop: true,
        fixedHeader: true,
        columns: [
          { data: 'thema' },
          { data: 'stichworte' },
          { data: 'lernfeld' },
          { data: 'link',
            render: d => `<a href="${d}" target="_blank">Öffnen</a>` }
        ],

        initComplete: function () {
          let api = this.api();

          // Neue Header-Zeile für Suchfelder erzeugen
          $('#lernapp thead tr').clone(true).appendTo('#lernapp thead');

          // Inputs einfügen
          $('#lernapp thead tr:eq(1) th').each(function (i) {
            $(this).html('<input type="text" placeholder="Suche" />');

            $('input', this).on('keyup change', function () {
              if (api.column(i).search() !== this.value) {
                api.column(i).search(this.value).draw();
              }
            });
          });
        }
      });

    });

</script>

</body>
</html>
